citation: test://shape
# Discrete horizon = int(hosts.years * days_per_year). Slice-0 uses 365.
days_per_year: 365
drugs:
  - id: A
  - id: B
constraints:
  hard: []
  soft: []
  sources:
    - test://shape
policy:
  id: prefer_A
  rules:
    - preferred: [A, B]
  reserve: []
  duration:
    name: policy.duration
    provenance: assumed
    source: test://shape
    distribution:
      family: point
      fitted_params:
        value: 1.0
adherence:
  baseline_fidelity:
    name: adherence.baseline_fidelity
    provenance: assumed
    source: test://shape
    distribution:
      family: point
      fitted_params:
        value: 1.0
  deviation_drivers: {}
  deviation_target:
    drugs: [B]
determinant:
  id: det_A
  confers_resistance_to: [A]
  fitness_cost:
    name: determinant.fitness_cost
    provenance: assumed
    source: test://shape
    distribution:
      family: point
      fitted_params:
        value: 0.0
s_max:
  name: s_max
  provenance: assumed
  source: test://shape
  distribution:
    family: point
    fitted_params:
      value: 0.4
# A stands for ciprofloxacin in this toy. Starting resistance is
# 1 - (2025 TUH-Main Escherichia coli ciprofloxacin %S)/100.
# The tape is still a fake ban day, not a Temple restriction.
p0_from_transcript:
  year: 2025
  campus_id: TUH-Main
  organism: Escherichia coli
  drug: ciprofloxacin
p0:
  name: p0
  provenance: registry
  source: data/derived/antibiograms/tuh_main_transcript.csv
  distribution:
    family: point
    fitted_params:
      value: 0.44
